name: CI

on:
  push:
    branches:
      - master
      - build_refs_test
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Name the file per run
        run: |
          mkdir out
          cp data/a.txt out/a-${{ github.run_id }}.txt

      - name: Run build-archiver
        uses: kareltucek/build-archiver@build_refs
        with:
          FILE_PATTERN: "out/*.txt"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S3_ACCESS_KEY: ${{ secrets.UHK_BUILD_ARCHIVER_B2_ACCESS_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.UHK_BUILD_ARCHIVER_B2_ACCESS_KEY }}
          S3_BUCKET: "uhk-build-archives"
          S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          S3_KEY_PREFIX: "build-archiver-test/"
          S3_REGION: "us-east-005"

